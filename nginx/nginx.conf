worker_processes auto;
# /run is a fresh tmpfs mounted at container start (owned by root
# regardless of what the image sets), so the non-root nginx user can't
# write nginx.pid there. Use /tmp instead, which is part of the image
# filesystem and already chown'd to nginx in the Dockerfile.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    sendfile on;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    server {
        listen 443 ssl;

        # Server identity (issued by the private CA).
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Inbound mutual TLS: require and validate the client certificate
        # against the CA bundle (root + subordinate CA chain).
        ssl_client_certificate /etc/nginx/certs/ca_bundle.pem;
        ssl_verify_client on;
        ssl_verify_depth 2;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://127.0.0.1:8080;

            # Forward the verified client certificate details to the
            # validator app for additional application-level checks. The
            # app never has to speak TLS itself -- nginx has already
            # confirmed the certificate chains to a trusted CA.
            proxy_set_header X-Client-Cert-Escaped $ssl_client_escaped_cert;
            proxy_set_header X-Client-Cert-Subject-DN $ssl_client_s_dn;
            proxy_set_header X-Client-Cert-Issuer-DN $ssl_client_i_dn;
            proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
            proxy_set_header X-Client-Cert-Verify $ssl_client_verify;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
